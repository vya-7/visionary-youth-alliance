<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Batch Verification Admin — VYA</title>
<style>
:root{--navy:#081633;--panel:#0f2557;--line:#1a3166;--ink:#eef1ff;--muted:#9aa3d1;--blue:#0a68c8;--purple:#6a1fb0;--cyan:#20bee5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--navy);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0b1b45;color:var(--ink);margin-top:5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan)}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.88rem}
label{display:block;font-size:.8rem;color:var(--muted);margin-top:14px;font-weight:600}
.btn{border:0;cursor:pointer;border-radius:10px;padding:10px 16px;font-weight:600;color:#fff;background:linear-gradient(100deg,var(--blue),var(--purple))}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid #f87171;color:#f87171}
.btn:disabled{opacity:.6;cursor:wait}
.hint{color:var(--muted);font-size:.8rem;margin-top:6px}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#123a80,var(--navy) 65%);z-index:50;padding:20px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.box h2{font-size:1.2rem;margin-bottom:4px}
#app{display:none}
.bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#0a1d4b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar b{font-size:1rem;flex:1}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px;max-width:1200px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.side,.edit{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;cursor:pointer;transition:border-color .2s,background .2s}
.item:hover{border-color:var(--cyan)}
.item.on{background:linear-gradient(100deg,rgba(10,104,200,.3),rgba(106,31,176,.3));border-color:var(--cyan)}
.item b{display:block;font-size:.92rem}
.item span{font-size:.76rem;color:var(--muted)}
.item em{font-style:normal;font-size:.7rem;color:#f87171;margin-left:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.linkbox{margin-top:16px;padding:14px;border:1px dashed var(--cyan);border-radius:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.linkbox .qr svg{width:110px;height:110px;border-radius:8px;display:block}
.linkbox code{display:block;word-break:break-all;font-size:.78rem;color:#7cc8f5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
#toast.show{opacity:1}#toast.err{background:#dc2626}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h2>🎓 Batch Verification Admin</h2>
  <p class="hint">Separate from the main website admin. Sign in with your admin account.</p>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" style="width:100%;margin-top:18px" onclick="login()">Sign in</button>
  <p id="lerr" class="hint" style="color:#f87171"></p>
</div></div>

<div id="app">
  <div class="bar"><b>🎓 Batch Verification Pages</b><button class="btn ghost" onclick="auth.signOut()">Sign out</button></div>
  <div class="wrap">
    <div class="side">
      <button class="btn" style="width:100%" onclick="newBatch()">＋ New verification page</button>
      <div id="list"></div>
      <p class="hint" style="margin-top:14px">Every page here is its own link + QR. They are not shown anywhere on the main website.</p>
    </div>
    <div class="edit" id="edit"><p class="hint">Create a new page or pick one from the left.</p></div>
  </div>
</div>
<div id="toast"></div>

    ${b.id?`<div class="linkbox"><div class="qr" id="qrbox">${window.vyaQR?vyaQR(url,110):''}</div><div style="flex:1;min-width:200px"><b>Share / print this QR</b><code>${esc(url)}</code><div class="row" style="margin-top:8px"><button class="btn ghost" onclick="printQR()">🖨 Print QR</button><button class="btn ghost" onclick="downloadQR()">⬇️ Download QR</button></div></div></div>`:''}`;
}
function parseRecipients(text, prefix, existing){
  const used = new Set(), out = [];
  const rows = text.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{ const p=l.split('|').map(x=>x.trim()); return {name:p[0], position:p[1]||'', id:p[2]||''}; }).filter(r=>r.name);
  rows.forEach(r=>{ if(r.id) used.add(r.id); });
  const pad = Math.max(2, String(rows.length).length);
  let n = 0;
  rows.forEach(r=>{ if(r.id && r.id.indexOf(prefix)===0){ const m = /^(\d+)_/.exec(r.id.slice(prefix.length)); if(m) n = Math.max(n, parseInt(m[1],10)); } });
  rows.forEach((r,i)=>{
    let id = r.id;
    if(!id){ do{ n++; id = prefix + String(n).padStart(pad,'0') + '_' + r.name; }while(used.has(id)); used.add(id); }
    out.push({id, name:r.name, position:r.position});
  });
  return out;
}
async function saveBatch(){
  const b = cur, btn = $('sv');
  const title = $('f-title').value.trim();
  if(!title){ toast('Please enter the page title',true); return; }
  const prefix = ($('f-prefix').value.trim() || 'VYA').replace(/[^A-Za-z0-9]/g,'');
  const rec = parseRecipients($('f-rec').value, prefix);
  if(!rec.length){ toast('Add at least one recipient',true); return; }
  let id = b.id;
  if(b.isNew){
    const slug = ($('f-slug')||{}).value ? $('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-') : '';
    id = slug || rid();
    if(batches.some(x=>x.id===id)){ toast('That address is already used',true); return; }
  }
  const data = { title, certNo:$('f-certno').value.trim(), type:$('f-type').value.trim(), date:$('f-date').value, organizer:$('f-org').value.trim()||'Visionary Youth Alliance', prefix, message:$('f-msg').value.trim(), active:$('f-active').checked, recipients:rec, updatedAt:new Date().toISOString() };
  if(b.isNew) data.createdAt = new Date().toISOString(); else data.createdAt = b.createdAt || new Date().toISOString();
  btn.disabled = true;
  try{
    await db.collection('batches').doc(id).set(data);
    toast('Saved ✓');
    await loadAll();
    cur = Object.assign({id}, data); renderEdit(); renderList();
  }catch(e){ toast('Save failed: '+e.message,true); }
  btn.disabled = false;
}
async function delBatch(){
  if(!confirm('Delete this page permanently? Its link and QR will stop working.')) return;
  try{ await db.collection('batches').doc(cur.id).delete(); toast('Deleted'); cur=null; $('edit').innerHTML='<p class="hint">Deleted. Create a new page or pick one.</p>'; await loadAll(); }catch(e){ toast('Failed: '+e.message,true); }
}
async function copyLink(){ const u=pageUrl(cur.id); try{ await navigator.clipboard.writeText(u); toast('Link copied ✓'); }catch(e){ prompt('Copy this link:',u); } }
function printQR(){
  const w = window.open('','_blank'); if(!w){ toast('Allow pop-ups to print',true); return; }
  w.document.write('<!doctype html><title>QR</title><body style="margin:0;font-family:Arial;text-align:center;padding:30px"><h2>'+esc(cur.title)+'</h2><p>'+esc(cur.certNo||'')+'</p><div style="width:320px;margin:20px auto">'+vyaQR(pageUrl(cur.id),320)+'</div><p style="color:#555;font-size:12px">Scan to verify</p></body>');
  w.document.close(); setTimeout(()=>{ try{ w.print(); }catch(e){} },400);
}
function downloadQR(){
  const svg = vyaQR(pageUrl(cur.id),512), blob = new Blob([svg],{type:'image/svg+xml'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'qr-'+cur.id+'.svg'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
</script>
