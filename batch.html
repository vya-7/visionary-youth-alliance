<style>
:root{--navy:#081633;--blue:#0a68c8;--purple:#6a1fb0;--cyan:#20bee5;--ink:#0f1533;--muted:#5b6382;--line:#e2e6f5;--paper:#f5f7fd;--ease:cubic-bezier(.22,.7,.2,1);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
.top{background:radial-gradient(ellipse at 50% -20%,#123a80 0%,var(--navy) 62%);color:#fff;text-align:center;padding:46px 20px 86px;position:relative;overflow:hidden;}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0}
.top::before{width:340px;height:340px;left:-100px;top:-120px;background:#139ce1}
.top::after{width:380px;height:380px;right:-120px;bottom:-200px;background:var(--purple)}
.top>*{position:relative;z-index:1}
.logo{width:84px;height:84px;border-radius:22px;background:#fff;object-fit:cover;box-shadow:0 14px 40px rgba(32,190,229,.35);animation:rise .8s var(--ease) both}
.kick{margin-top:16px;font:600 .74rem Poppins,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#7cc8f5;animation:rise .8s .1s var(--ease) both}
h1{font:800 clamp(1.5rem,5vw,2.3rem)/1.2 Poppins,sans-serif;margin:8px auto 14px;max-width:760px;background:linear-gradient(100deg,#fff,#a8dcff 55%,#d6b8ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s .2s var(--ease) both}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;animation:rise .8s .3s var(--ease) both}
.chip{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:999px;padding:7px 16px;font-size:.84rem}
.chip b{font-family:ui-monospace,Menlo,monospace;letter-spacing:.05em}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
main{flex:1;max-width:820px;width:100%;margin:-52px auto 0;padding:0 18px 40px;position:relative;z-index:2}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(8,22,51,.12);padding:26px;animation:rise .8s .4s var(--ease) both}
.ok{display:flex;gap:12px;align-items:center;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:14px;padding:12px 16px;font-size:.92rem;margin-bottom:18px}
.ok i{font-style:normal;font-size:1.3rem}
.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tools input{flex:1;min-width:200px;padding:12px 14px;border:1px solid #d9def2;border-radius:12px;font:inherit;background:#f8f9ff}
.tools input:focus{outline:2px solid var(--blue);background:#fff}
.count{color:var(--muted);font-size:.82rem;margin:8px 2px 10px}
.row{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid #eef0fa;transition:background .2s,transform .2s}
.row:last-child{border-bottom:0}
.row:hover{background:#f6f8ff}
.row.hit{background:linear-gradient(100deg,rgba(10,104,200,.1),rgba(106,31,176,.1));outline:2px solid var(--blue);border-radius:12px}
.no{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font:700 .8rem Poppins,sans-serif;display:flex;align-items:center;justify-content:center}
.nm{flex:1;min-width:0}
.nm b{display:block;font:600 1rem Poppins,sans-serif;color:var(--ink);overflow-wrap:anywhere}
.nm span{font:500 .78rem ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.04em;overflow-wrap:anywhere}
.pos{flex:none;background:#eef3ff;color:#1559b5;border-radius:999px;padding:5px 12px;font-size:.76rem;font-weight:600;white-space:nowrap}
.msg{margin-top:22px;padding:16px 18px;border-left:3px solid var(--purple);background:#f6f2fd;border-radius:0 12px 12px 0;color:#3a2a5c;font-size:.92rem;white-space:pre-line}
.sign{margin-top:8px;font-weight:600;color:var(--purple);font-size:.9rem}
.note{margin-top:16px;text-align:center;color:var(--muted);font-size:.78rem}
.load{text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px 16px 26px}
footer a{color:#16a34a;font-weight:700;text-decoration:none}
@media(max-width:520px){.card{padding:18px}.pos{display:none}.row{gap:10px}}
@media print{.tools,.top::before,.top::after{display:none}.card{box-shadow:none}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.vbadge{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:7px 16px;border-radius:999px;background:rgba(34,197,94,.16);border:1px solid rgba(74,222,128,.45);color:#bbf7d0;font:600 .78rem Poppins,sans-serif;letter-spacing:.06em;animation:rise .8s var(--ease) both}
.vbadge:before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:linear-gradient(135deg,#f3f7ff,#f6f0ff);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font:800 1.35rem Poppins,sans-serif;background:linear-gradient(100deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.row{cursor:pointer;animation:rise .5s var(--ease) both}
.idp{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:7px;background:#eef3ff;color:#0c2457;font:600 .78rem ui-monospace,Menlo,monospace;letter-spacing:.04em}
.view{flex:none;border:0;border-radius:999px;padding:8px 14px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font:600 .78rem Poppins,sans-serif;cursor:pointer}
#cm{position:fixed;inset:0;z-index:50;background:rgba(8,22,51,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#cm.on{display:flex}
.cert{width:100%;max-width:460px;background:#fff;border-radius:24px;padding:10px;background:linear-gradient(135deg,#0a68c8,#6a1fb0);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .5s var(--ease) both;margin:auto}
.cert-in{background:linear-gradient(#fff,#f6f8ff);border-radius:16px;padding:28px 22px;text-align:center;border:1px solid #d8def5}
.cert-in img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 24px rgba(10,104,200,.25)}
.cert-in .org{font:700 1.1rem Poppins,sans-serif;margin:10px 0 2px}
.cert-in .ty{font:600 .72rem Poppins,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);margin-bottom:14px}
.cert-in .sm{color:var(--muted);font-size:.9rem}
.cert-in .nm2{font:800 1.7rem/1.2 Poppins,sans-serif;margin:6px 0 8px;background:linear-gradient(100deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.cert-in .ev{font:700 1.02rem Poppins,sans-serif;margin:6px 0}
.cert-in .ps{display:inline-block;margin:8px 0;background:#eef3ff;color:#1559b5;border-radius:999px;padding:5px 14px;font-weight:600;font-size:.82rem}
.cert-in dl{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px;text-align:left}
.cert-in dt{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cert-in dd{font:600 .95rem Poppins,sans-serif;overflow-wrap:anywhere}
.cert-in dd.mono{font-family:ui-monospace,Menlo,monospace}
.cert-ok{margin-top:14px;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:9px;font-weight:600;font-size:.86rem}
.cact{display:flex;gap:10px;justify-content:center;margin-top:14px}
.cact button{border:0;border-radius:999px;padding:10px 20px;font:600 .85rem Poppins,sans-serif;cursor:pointer;background:rgba(255,255,255,.95);color:#0c2457}
@media print{body *{visibility:hidden}#cm,#cm *{visibility:visible}#cm{position:absolute;background:#fff}.cact{display:none}}
</style>
<style id="splash-css">
  #splash{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:var(--navy);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease, visibility .6s ease;}
  @keyframes splashForceHide{to{opacity:0;visibility:hidden;pointer-events:none;}}
  #splash{animation:splashForceHide 0.01s 6s forwards;}
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  #splash img{width:92px;height:92px;border-radius:22px;margin-bottom:22px;animation:splashPop .7s ease;}
  #splash h2{color:#fff;font-size:1.25rem;margin-bottom:6px;opacity:0;animation:fadeIn .6s ease .25s forwards;}
  #splash p{color:#9aa3d1;font-size:0.85rem;margin-bottom:30px;opacity:0;animation:fadeIn .6s ease .4s forwards;}
  #splash .bar-track{width:180px;height:4px;background:rgba(255,255,255,0.15);border-radius:999px;overflow:hidden;}
  #splash .bar-fill{height:100%;width:0%;background:linear-gradient(100deg,var(--blue),var(--purple));border-radius:999px;animation:fillBar 4.3s ease forwards;}
  @keyframes splashPop{from{transform:scale(0.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes fadeIn{to{opacity:1;}}
  @keyframes fillBar{to{width:100%;}}
</style>
<style id="splash2-css">
#splash{background:radial-gradient(circle at 50% 36%,#0e3d8a 0%,#081633 58%,#050f26 100%) !important;overflow:hidden;clip-path:circle(150% at 50% 50%);transition:clip-path .8s cubic-bezier(.77,0,.18,1),opacity .5s .35s,visibility 0s .85s !important;}
#splash.hide{clip-path:circle(0% at 50% 50%);opacity:0;visibility:hidden;}
#splash::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(124,200,245,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,200,245,.05) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%);}
.sp-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:spDrift 7s ease-in-out infinite alternate;}
.sp-orb1{width:420px;height:420px;left:-120px;top:-100px;background:#139ce1;}
.sp-orb2{width:460px;height:460px;right:-140px;bottom:-140px;background:#6a1fb0;animation-delay:-3s;}
@keyframes spDrift{to{transform:translate(60px,40px) scale(1.15);}}
.sp-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px;}
.sp-ring{position:relative;width:120px;height:120px;border-radius:30px;margin-bottom:30px;animation:spPop .9s cubic-bezier(.34,1.56,.64,1) both;}
.sp-ring::before{content:"";position:absolute;inset:-5px;border-radius:35px;background:conic-gradient(from 0deg,#20bee5,#0a62bb,#6a1fb0,#b48af0,#20bee5);animation:spSpin 2.6s linear infinite;}
.sp-ring::after{content:"";position:absolute;inset:-20px;border-radius:46px;background:conic-gradient(from 180deg,#20bee5,transparent 40%,#6a1fb0,transparent 80%);filter:blur(24px);opacity:.6;animation:spSpin 2.6s linear infinite reverse;}
.sp-logo{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:#fff;z-index:1;}
#splash .sp-logo img{width:100% !important;height:100% !important;object-fit:cover;margin:0 !important;border-radius:0 !important;animation:none !important;}
@keyframes spSpin{to{transform:rotate(360deg);}}
@keyframes spPop{from{opacity:0;transform:scale(.4) rotate(-12deg);}to{opacity:1;transform:none;}}
#splash h2{opacity:1 !important;animation:none !important;font:700 clamp(1.35rem,4.6vw,1.9rem)/1.2 Poppins,sans-serif !important;letter-spacing:-.01em;margin:0 0 10px !important;}
#splash h2 .w{display:inline-block;margin:0 .14em;opacity:0;transform:translateY(18px);filter:blur(7px);background:linear-gradient(100deg,#ffffff,#9fdcff 55%,#cfaeff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:spWord .75s cubic-bezier(.22,.7,.2,1) calc(.6s + var(--i) * .15s) forwards;}
@keyframes spWord{to{opacity:1;transform:none;filter:none;}}
#splash p{letter-spacing:.24em;text-transform:uppercase;font-size:.7rem !important;color:#8fc9ee !important;margin-bottom:34px !important;animation-delay:1.2s !important;}
#splash .bar-track{width:230px;height:5px;background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.04);}
#splash .bar-fill{background:linear-gradient(100deg,#20bee5,#0a68c8 55%,#6a1fb0) !important;box-shadow:0 0 14px rgba(32,190,229,.7);}
.sp-pct{margin-top:14px;font:600 .8rem Poppins,sans-serif;color:#9fc9ec;letter-spacing:.12em;}
.sp-dot{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#7cc8f5;opacity:0;box-shadow:0 0 10px #7cc8f5;animation:spRise 4.6s ease-in infinite;animation-delay:var(--d);z-index:1;}
@keyframes spRise{0%{transform:translateY(0);opacity:0;}15%{opacity:.9;}100%{transform:translateY(-105vh);opacity:0;}}
.credit-name{color:#4ade80 !important;font-weight:700;text-decoration:none;position:relative;transition:text-shadow .25s,color .25s;}
.credit-name::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:#4ade80;transform:scaleX(0);transform-origin:left;transition:transform .3s;}
.credit-name:hover{color:#86efac !important;text-shadow:0 0 14px rgba(74,222,128,.55);}
.credit-name:hover::after{transform:scaleX(1);}
@media(prefers-reduced-motion:reduce){.sp-orb,.sp-dot,.sp-ring::before,.sp-ring::after{animation:none !important;}}
</style>
<style id="d3-css">
/* ===== 3D layer ===== */
.d3-host{position:relative;isolation:isolate;}
.d3-scene{position:absolute!important;inset:0!important;width:auto!important;height:auto!important;overflow:hidden;pointer-events:none;perspective:900px;z-index:-1}
.d3-cube{position:absolute;width:var(--s,46px);height:var(--s,46px);transform-style:preserve-3d;animation:d3spin var(--t,16s) linear infinite;left:var(--x);top:var(--y);opacity:.9}
.d3-cube i{position:absolute;inset:0;border:1px solid rgba(124,200,245,.55);background:linear-gradient(135deg,rgba(32,190,229,.22),rgba(106,31,176,.28));box-shadow:inset 0 0 14px rgba(124,200,245,.25)}
.d3-cube i:nth-child(1){transform:translateZ(calc(var(--s,46px)/2))}
.d3-cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s,46px)/2))}
.d3-cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s,46px)/2))}
.d3-cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s,46px)/2))}
.d3-cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s,46px)/2))}
.d3-cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s,46px)/2))}
.d3-bob{position:absolute;left:var(--x);top:var(--y);animation:d3bob var(--bt,7s) ease-in-out infinite}
.d3-bob .d3-cube{position:relative;left:0;top:0}
@keyframes d3spin{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(335deg) rotateY(360deg)}}
@keyframes d3bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.d3-orb{position:absolute;left:var(--x);top:var(--y);width:var(--s,90px);height:var(--s,90px);border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),rgba(124,200,245,.55) 28%,rgba(10,104,200,.35) 58%,rgba(106,31,176,.25));box-shadow:0 18px 40px rgba(10,104,200,.28),inset -10px -14px 26px rgba(8,22,51,.35);animation:d3bob var(--bt,9s) ease-in-out infinite;opacity:.85}
/* logo scene */
.d3-logo{position:relative;display:block;width:fit-content;margin:0 auto 24px;perspective:900px;transform-style:preserve-3d}
.d3-logo .hero-logo{margin:0 auto;display:block;transform-style:preserve-3d;transition:transform .25s ease-out;border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.25);animation:none!important}
.d3-ring{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;border:2px solid rgba(124,200,245,.6);box-shadow:0 0 18px rgba(32,190,229,.5),inset 0 0 18px rgba(32,190,229,.25);transform-style:preserve-3d;animation:d3ring 7s linear infinite;pointer-events:none}
.d3-ring.r2{width:230px;height:230px;margin:-115px 0 0 -115px;border-color:rgba(180,138,240,.6);box-shadow:0 0 18px rgba(106,31,176,.5);animation:d3ring2 10s linear infinite}
.d3-ring:after{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#7cc8f5;box-shadow:0 0 14px #20bee5}
@keyframes d3ring{from{transform:rotateX(70deg) rotateZ(0)}to{transform:rotateX(70deg) rotateZ(360deg)}}
@keyframes d3ring2{from{transform:rotateX(70deg) rotateY(35deg) rotateZ(360deg)}to{transform:rotateX(70deg) rotateY(35deg) rotateZ(0)}}
/* 3D buttons */
.btn,button.btn-primary,.btn-primary{transition:transform .18s ease,box-shadow .18s ease}
.btn-primary{box-shadow:0 6px 0 #0a3f86,0 14px 26px rgba(10,104,200,.35)!important;transform:translateY(-2px)}
.btn-primary:hover{transform:translateY(-4px)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 #0a3f86,0 6px 12px rgba(10,104,200,.3)!important}
/* card depth */
.fx-tilt{transform-style:preserve-3d}
.fx-tilt h3,.fx-tilt h4,.fx-tilt .ico,.fx-tilt .av,.fx-tilt .avatar,.fx-tilt .cover{transform:translateZ(26px)}
.d3-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.55),transparent 55%);opacity:0;transition:opacity .25s;mix-blend-mode:soft-light}
.d3-tilt:hover .d3-glare{opacity:1}
.d3-tilt{transform-style:preserve-3d;transition:transform .2s ease-out;will-change:transform}
@media(max-width:640px){.d3-cube{--s:30px!important}.d3-orb{--s:56px!important}.d3-ring{width:150px;height:150px;margin:-75px 0 0 -75px}.d3-ring.r2{width:180px;height:180px;margin:-90px 0 0 -90px}}
@media(prefers-reduced-motion:reduce){.d3-cube,.d3-bob,.d3-orb,.d3-ring{animation:none!important}}
@media print{.d3-scene,.d3-ring{display:none!important}}
</style>

firebase.initializeApp({apiKey:"AIzaSyAJfXWIdIx3Ukpot_5D419nZHG9x1RVtWQ",authDomain:"vya-web.firebaseapp.com",projectId:"vya-web",storageBucket:"vya-web.firebasestorage.app",messagingSenderId:"809021745111",appId:"1:809021745111:web:97d25f5a0477ccfb24cd92"});
const db = firebase.firestore();
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(v){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||'')); if(!m) return esc(v||''); return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }
const card = document.getElementById('b-card');
function fail(t,m){ document.getElementById('b-title').textContent = t; card.innerHTML = '<div class="ok bad"><i>❌</i><div>'+esc(m)+'</div></div>'; }
let B = null;
function logoSrc(){ try{ return (document.querySelector('.top img')||document.querySelector('link[rel=icon]')).src||document.querySelector('link[rel=icon]').href; }catch(e){ return ''; } }
function renderList(){
  const q = (document.getElementById('b-q').value||'').trim().toLowerCase();
  const rs = (B.recipients||[]);
  const shown = rs.map((r,i)=>({r,i})).filter(x=>!q || (x.r.name+' '+x.r.id+' '+(x.r.position||'')).toLowerCase().includes(q));
  document.getElementById('b-count').textContent = rs.length + ' recipient(s)' + (q ? ' — showing ' + shown.length : '');
  const exact = q && shown.length===1 && String(shown[0].r.id).toLowerCase()===q;
  document.getElementById('b-list').innerHTML = shown.map((x,k)=>'<div class="row'+(exact?' hit':'')+'" style="animation-delay:'+Math.min(k,12)*40+'ms" onclick="openCert('+x.i+')"><div class="no">'+(x.i+1)+'</div><div class="nm"><b>'+esc(x.r.name)+'</b><span class="idp">'+esc(x.r.id)+'</span></div>'+(x.r.position?'<div class="pos">🏅 '+esc(x.r.position)+'</div>':'')+'<button class="view" type="button">View</button></div>').join('') || '<p class="load">No match found.</p>';
}
function openCert(i){
  const r = B.recipients[i]; if(!r) return;
  document.getElementById('cm').innerHTML = '<div><div class="cert"><div class="cert-in"><img src="'+logoSrc()+'" alt="">'
   +'<div class="org">Visionary Youth Alliance</div>'+(B.type?'<div class="ty">'+esc(B.type)+'</div>':'')
   +'<div class="sm">This is to certify that</div><div class="nm2">'+esc(r.name)+'</div>'
   +(r.position?'<div class="ps">🏅 '+esc(r.position)+'</div>':'')
   +'<div class="sm">has successfully completed / participated in</div><div class="ev">'+esc(B.title||'')+'</div>'
   +'<dl>'+(B.date?'<div><dt>Issued on</dt><dd>'+fmtDate(B.date)+'</dd></div>':'')+'<div><dt>Certificate ID</dt><dd class="mono">'+esc(r.id)+'</dd></div>'+(B.certNo?'<div><dt>Certificate No</dt><dd class="mono">'+esc(B.certNo)+'</dd></div>':'')+'</dl>'
   +'<div class="cert-ok">✅ Verified certificate issued by '+esc(B.organizer||'Visionary Youth Alliance')+'</div></div></div>'
   +'<div class="cact"><button type="button" onclick="window.print()">🖨 Print</button><button type="button" onclick="closeCert()">Close</button></div></div>';
  document.getElementById('cm').classList.add('on');
  try{ history.replaceState(null,'','?b='+encodeURIComponent(new URLSearchParams(location.search).get('b'))+'&id='+encodeURIComponent(r.id)); }catch(e){}
}
function closeCert(){ document.getElementById('cm').classList.remove('on'); try{ history.replaceState(null,'','?b='+encodeURIComponent(new URLSearchParams(location.search).get('b'))); }catch(e){} }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCert(); });
async function load(){
  const id = new URLSearchParams(location.search).get('b');
  if(!id || /[\/.#\[\]$]/.test(id) || id.length > 60){ fail('Page not found','This verification link is not valid. Please scan the QR code on your certificate again.'); return; }
  try{
    const doc = await db.collection('batches').doc(id).get();
    if(!doc.exists){ fail('Page not found','No verification record matches this link.'); return; }
    B = doc.data() || {};
    if(B.active === false){ fail(B.title || 'Verification page','This verification page is no longer active.'); return; }
    document.title = (B.title||'Certificate Verification') + ' — Visionary Youth Alliance';
    document.getElementById('b-title').textContent = B.title || 'Certificate Verification';
    document.getElementById('b-chips').innerHTML = (B.certNo?'<div class="chip">Certificate No: <b>'+esc(B.certNo)+'</b></div>':'')+(B.type?'<div class="chip">'+esc(B.type)+'</div>':'')+(B.date?'<div class="chip">📅 '+fmtDate(B.date)+'</div>':'')+(B.organizer?'<div class="chip">By '+esc(B.organizer)+'</div>':'');
    card.innerHTML = '<div class="ok"><i>✅</i><div><b>Verified.</b> The people below were issued '+(B.type?esc(B.type):'a certificate')+' for this event by '+esc(B.organizer||'Visionary Youth Alliance')+'.</div></div>'
      + '<div class="stats"><div class="stat"><b data-n="'+(B.recipients||[]).length+'">'+(B.recipients||[]).length+'</b><span>Recipients</span></div><div class="stat"><b>'+esc(B.date?new Date(B.date).getFullYear():'—')+'</b><span>Year</span></div><div class="stat"><b>✓</b><span>Verified</span></div></div>'
      + '<div class="tools"><input id="b-q" placeholder="Search by name or ID…" oninput="renderList()"></div><div class="count" id="b-count"></div><div id="b-list"></div>'
      + (B.message?'<div class="msg">'+esc(B.message)+'<div class="sign">— '+esc(B.organizer||'Visionary Youth Alliance')+' Authority</div></div>':'')
      + '<p class="note">🔒 Keep this link private. It is meant to be opened by scanning the QR code on a certificate.</p>';
    renderList();
    const want = new URLSearchParams(location.search).get('id');
    if(want){ const k=(B.recipients||[]).findIndex(r=>String(r.id).toLowerCase()===want.toLowerCase()); if(k>=0) openCert(k); }
  }catch(e){ console.error(e); fail('Could not load','Please check your internet connection and try again.'); }
}
let minT=false,dl=false;
function hideSplash(){ if(minT&&dl){ const s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(()=>s.remove(),700); } } }
setTimeout(()=>{ minT=true; hideSplash(); },3200);
setTimeout(()=>{ minT=true; dl=true; hideSplash(); },9000);
load().finally(()=>{ dl=true; hideSplash(); });
</script>
<script id="d3-js">
(function(){
  try{
    var fine = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
    function cube(x,y,s,t,bt){ return '<div class="d3-bob" style="--x:'+x+';--y:'+y+';--bt:'+bt+'s"><div class="d3-cube" style="--s:'+s+'px;--t:'+t+'s"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>'; }
    function scene(host){
      if(!host || host.__d3) return; host.__d3 = 1; host.classList.add('d3-host');
      var d = document.createElement('div'); d.className = 'd3-scene'; d.setAttribute('aria-hidden','true');
      d.innerHTML = cube('7%','18%',44,18,7) + cube('88%','12%',34,13,6) + cube('80%','62%',52,22,9) + cube('13%','66%',30,15,8)
        + '<div class="d3-orb" style="--x:92%;--y:40%;--s:70px;--bt:8s"></div><div class="d3-orb" style="--x:3%;--y:42%;--s:48px;--bt:10s"></div>';
      host.insertBefore(d, host.firstChild);
      if(fine){ host.addEventListener('pointermove', function(e){ var r = host.getBoundingClientRect(); var x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5; d.style.transform = 'translate3d('+(x*-18)+'px,'+(y*-12)+'px,0)'; }); }
    }
    document.querySelectorAll('.hero, .page-head, .bl-hero').forEach(scene);
    // hero logo as a 3D coin with orbit rings that follows the pointer
    var logo = document.querySelector('.hero .hero-logo');
    if(logo && !logo.parentNode.classList.contains('d3-logo')){
      var w = document.createElement('div'); w.className = 'd3-logo';
      logo.parentNode.insertBefore(w, logo); w.appendChild(logo);
      w.insertAdjacentHTML('afterbegin','<i class="d3-ring"></i><i class="d3-ring r2"></i>');
      var hero = logo.closest('.hero') || document.body;
      function aim(x,y){ logo.style.transform = 'rotateY('+(x*26).toFixed(1)+'deg) rotateX('+(-y*20).toFixed(1)+'deg)'; }
      if(fine){ hero.addEventListener('pointermove', function(e){ var r = hero.getBoundingClientRect(); aim((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5); }); hero.addEventListener('pointerleave', function(){ aim(0,0); }); }
      else if(window.DeviceOrientationEvent){ window.addEventListener('deviceorientation', function(e){ if(e.gamma==null) return; aim(Math.max(-1,Math.min(1,e.gamma/40))/2, Math.max(-1,Math.min(1,(e.beta-45)/40))/2); }, {passive:true}); }
      var t0 = performance.now(); (function idle(t){ if(!logo.matches(':hover') && !(fine && hero.matches(':hover'))){ var a = (t-t0)/1000; logo.style.transform = 'rotateY('+(Math.sin(a*.8)*14).toFixed(1)+'deg) rotateX('+(Math.cos(a*.6)*6).toFixed(1)+'deg)'; } requestAnimationFrame(idle); })(t0);
    }
    // certificate cards: 3D tilt + glare
    function tiltEl(el, max){
      if(!el || el.__d3t) return; el.__d3t = 1; el.classList.add('d3-tilt');
      var g = document.createElement('i'); g.className = 'd3-glare'; el.appendChild(g);
      if(getComputedStyle(el).position === 'static') el.style.position = 'relative';
      var par = el.parentNode; if(par && par.style) par.style.perspective = '1000px';
      function mv(cx,cy){ var r = el.getBoundingClientRect(), x = (cx-r.left)/r.width, y = (cy-r.top)/r.height; el.style.transform = 'rotateY('+((x-.5)*max).toFixed(1)+'deg) rotateX('+((.5-y)*max).toFixed(1)+'deg) scale(1.02)'; el.style.setProperty('--gx',(x*100)+'%'); el.style.setProperty('--gy',(y*100)+'%'); }
      el.addEventListener('pointermove', function(e){ mv(e.clientX,e.clientY); });
      el.addEventListener('pointerleave', function(){ el.style.transform=''; });
      el.addEventListener('touchmove', function(e){ var t = e.touches[0]; if(t) mv(t.clientX,t.clientY); }, {passive:true});
      el.addEventListener('touchend', function(){ el.style.transform=''; });
    }
    function scan(){ document.querySelectorAll('.cert, .cert-card, .idcard, .member-card').forEach(function(e){ tiltEl(e, 12); }); }
    scan(); new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  }catch(e){ console.warn('d3',e); }
})();
</script>
</body>
</html>
