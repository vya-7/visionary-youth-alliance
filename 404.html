<main>

<script id="search-js">
(function(){
  var DATA=null,loading=null,idx=[],sel=0,res=[];
  var PAGES=[['🏠','Home','index.html','Visionary Youth Alliance home page'],['ℹ️','About us','index.html#about','Who we are, vision and mission'],['🎯','Programs','programs.html','Our programs and activities'],['👥','Team','team.html','Meet the team'],['📝','Blog','blog.html','Stories, updates and ideas'],['🧠','Quiz','quiz.html','Test your knowledge'],['✅','Verify certificate','verify.html','Check a certificate or member ID'],['🤝','Join us','index.html#join','Apply to become a member'],['📅','Events','index.html#events','Upcoming events'],['❓','FAQ','index.html#faq','Frequently asked questions']];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  function strs(o){var a=[];(function w(v,d){if(d>3||v==null)return;if(typeof v==='string'){if(!/^https?:\/\//i.test(v)&&!/^data:/i.test(v))a.push(v)}else if(Array.isArray(v))v.forEach(function(x){w(x,d+1)});else if(typeof v==='object')Object.keys(v).forEach(function(k){if(!/^(id|image|photo|logo|link|url|icon)$/i.test(k))w(v[k],d+1)})})(o,0);return a.join(' ')}
  function build(d){
    idx=[];
    PAGES.forEach(function(p){idx.push({g:'Pages',ic:p[0],t:p[1],s:p[3],u:p[2],h:(p[1]+' '+p[3]).toLowerCase(),b:3})});
    try{(d.programs&&d.programs.pillars||[]).forEach(function(x){idx.push({g:'Programs',ic:x.icon||'🎯',t:x.title||'Program',s:x.text||'',u:'programs.html',h:strs(x).toLowerCase(),b:2})})}catch(e){}
    try{(d.team||[]).forEach(function(x){if(!x||!x.name||/^Add Name$/i.test(x.name))return;idx.push({g:'Team',ic:'👤',t:x.name,s:x.role||'',u:'team.html',h:strs(x).toLowerCase(),b:2})})}catch(e){}
    try{(d.blog||[]).forEach(function(x){if(!x||!x.title)return;idx.push({g:'Blog',ic:x.icon||'📝',t:x.title,s:x.excerpt||'',u:'blog-post.html?id='+encodeURIComponent(x.id||''),h:strs(x).toLowerCase(),b:2})})}catch(e){}
    try{(d.events||[]).forEach(function(x){if(!x)return;idx.push({g:'Events',ic:'📅',t:x.title||x.name||'Event',s:[x.date,x.place||x.location].filter(Boolean).join(' · '),u:'index.html#events',h:strs(x).toLowerCase(),b:2})})}catch(e){}
    try{(d.faq||[]).forEach(function(x){if(!x||!x.q)return;idx.push({g:'FAQ',ic:'❓',t:x.q,s:x.a||'',u:'index.html#faq',h:strs(x).toLowerCase(),b:1})})}catch(e){}
    try{(d.testimonials||[]).forEach(function(x){if(!x)return;idx.push({g:'Testimonials',ic:'💬',t:x.name||'Member',s:x.quote||x.text||'',u:'index.html#testimonials',h:strs(x).toLowerCase(),b:1})})}catch(e){}
  }
  function load(){
    if(DATA) return Promise.resolve();
    if(loading) return loading;
    function fb(){return fetch('data.json?v='+Date.now()).then(function(r){return r.json()})}
    loading=Promise.resolve().then(function(){
      try{ if(window.firebase&&firebase.firestore) return firebase.firestore().collection('site').doc('content').get().then(function(s){ if(s.exists) return s.data(); return fb(); }).catch(fb); }catch(e){}
      return fb();
    }).catch(function(){return {}}).then(function(d){DATA=d||{};build(DATA)});
    return loading;
  }
  function hl(text,terms){
    var out=esc(text);
    terms.forEach(function(t){ if(!t) return; var re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); out=out.replace(re,function(m){return m.indexOf('&')===0?m:'<mark>'+m+'</mark>'}); });
    return out;
  }
  function snip(s,terms){
    s=String(s||'').replace(/\s+/g,' ').trim(); if(s.length<=110) return s;
    var low=s.toLowerCase(),p=-1; for(var i=0;i<terms.length;i++){p=low.indexOf(terms[i]);if(p>=0)break}
    if(p<0) return s.slice(0,110)+'…';
    var a=Math.max(0,p-40); return (a>0?'…':'')+s.slice(a,a+110)+(a+110<s.length?'…':'');
  }
  function search(q){
    q=q.trim().toLowerCase(); var terms=q.split(/\s+/).filter(Boolean);
    if(!terms.length) return [];
    var out=[];
    idx.forEach(function(it){
      var ok=terms.every(function(t){return it.h.indexOf(t)>=0}); if(!ok) return;
      var tl=it.t.toLowerCase(),sc=it.b;
      terms.forEach(function(t){ if(tl===t) sc+=10; else if(tl.indexOf(t)===0) sc+=6; else if(tl.indexOf(t)>=0) sc+=4; if((it.s||'').toLowerCase().indexOf(t)>=0) sc+=1; });
      out.push({it:it,sc:sc});
    });
    out.sort(function(a,b){return b.sc-a.sc});
    return out.slice(0,30).map(function(x){return x.it});
  }
  var root,input,list;
  function ensure(){
    if(root) return;
    root=document.createElement('div'); root.id='sx'; root.setAttribute('role','dialog'); root.setAttribute('aria-modal','true'); root.setAttribute('aria-label','Search');
    root.innerHTML='<div class="sx-box"><div class="sx-top"><span class="i">🔍</span><input id="sx-in" type="search" placeholder="Search programs, team, blog, events, FAQ…" autocomplete="off" enterkeyhint="search" spellcheck="false"><button class="sx-x" type="button" id="sx-close">ESC</button></div><div class="sx-list" id="sx-list"></div><div class="sx-f"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div></div>';
    document.body.appendChild(root);

    input.addEventListener('input',render);
    input.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'){e.preventDefault();mv(1)} else if(e.key==='ArrowUp'){e.preventDefault();mv(-1)} else if(e.key==='Enter'){e.preventDefault();go(sel)}

  function mv(d){ if(!res.length) return; sel=(sel+d+res.length)%res.length; paint(); var a=list.querySelector('.act'); if(a&&a.scrollIntoView) a.scrollIntoView({block:'nearest'}); }

  function row(r,i,terms){ return '<a class="sx-r'+(i===sel?' act':'')+'" data-i="'+i+'" href="'+esc(r.u)+'"><div class="sx-ic">'+esc(r.ic)+'</div><div><div class="sx-t">'+hl(r.t,terms)+'</div>'+(r.s?'<div class="sx-s">'+hl(snip(r.s,terms),terms)+'</div>':'')+'</div></a>'; }
  function paint(){ var n=list.querySelectorAll('.sx-r'); for(var i=0;i<n.length;i++) n[i].classList.toggle('act',+n[i].getAttribute('data-i')===sel); }
  function render(){
    var q=input.value, terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    sel=0;
    if(!terms.length){ res=idx.filter(function(x){return x.g==='Pages'}); list.innerHTML='<div class="sx-h">Quick links</div>'+res.map(function(r,i){return row(r,i,[])}).join(''); return; }
    res=search(q);
    var cid=q.trim().match(/^VYA-?[A-Z0-9]{4}-?[A-Z0-9]{4}$/i);
    var pre=[]; if(cid){ var id=q.trim().toUpperCase(); if(id.indexOf('VYA-')!==0) id='VYA-'+id.slice(3); pre=[{g:'Verify',ic:'✅',t:'Verify certificate '+q.trim().toUpperCase(),s:'Check this certificate ID',u:'verify.html?id='+encodeURIComponent(id),h:''}]; }
    res=pre.concat(res);
    if(!res.length){ list.innerHTML='<div class="sx-e">😕 Nothing found for “'+esc(q.trim())+'”.<br>Try a different word, or <a href="blog.html">browse the blog</a>.</div>'; return; }
    var h='',last='';
    res.forEach(function(r,i){ if(r.g!==last){ h+='<div class="sx-h">'+esc(r.g)+'</div>'; last=r.g; } h+=row(r,i,terms); });
    list.innerHTML=h;
  }
  function open(){
    ensure(); root.classList.add('on'); document.documentElement.style.overflow='hidden'; input.value=''; list.innerHTML='<div class="sx-e">Loading…</div>';
    setTimeout(function(){input.focus()},30);
    load().then(function(){ if(root.classList.contains('on')) render(); });
  }
  function close(){ if(!root) return; root.classList.remove('on'); document.documentElement.style.overflow=''; }
  window.vyaSearch={open:open,close:close};
  function mount(){
    var row_=document.querySelector('.navrow'); if(!row_||document.getElementById('sx-open')) return;
    var b=document.createElement('button'); b.type='button'; b.id='sx-open'; b.className='sx-btn'; b.setAttribute('aria-label','Search the site'); b.title='Search (Ctrl+K)'; b.textContent='🔍';

    else if(e.key==='/'&&!typing){ e.preventDefault(); open(); }
